name: TruffleHog secrets

on:
  pull_request:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: ['**']
    tags: ['**']
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number; zero scans complete default-branch history'
        required: false
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: trufflehog-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-tests:
    name: Secret scan policy regressions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate policy for unprivileged regression tests
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download and verify immutable scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --silent --show-error \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.2/trufflehog_3.99.2_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/trufflehog.tar.gz"
          printf '%s  %s\n' '3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4' "$RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog
      - name: Validate candidate exception policy before acceptance
        run: python3 .forlex/security/secret_scan.py validate-policy --policy .forlex/security/exceptions.json
      - name: Run protocol and real scanner canary regressions
        env:
          TRUFFLEHOG_BINARY: ${{ runner.temp }}/trufflehog
        run: python3 .forlex/security/test_secret_scan.py

  scan:
    name: Scan source with trusted policy
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      # Policy always comes from the accepted default branch, including auxiliary-base PRs.
      # Manual qualification runs from the default branch and takes PR data only.
      - name: Checkout trusted scanner policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-policy
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Bind current source and create exact-head check
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PR: ${{ inputs.pr_number || 0 }}
          SCAN_INTEGRATION_BRANCH: main
        run: |
          python3 trusted-policy/.forlex/security/secret_scan.py context \
            --event "$GITHUB_EVENT_PATH" --kind "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" --pr "$REQUEST_PR" \
            --integration-branch "$SCAN_INTEGRATION_BRANCH" \
            --output "$RUNNER_TEMP/secret-scan-context.json"
      - name: Checkout candidate as inert Git data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.context.outputs.merge || steps.context.outputs.tag_object || steps.context.outputs.head }}
          path: candidate-source
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download and verify immutable scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 --silent --show-error \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.2/trufflehog_3.99.2_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/trufflehog.tar.gz"
          printf '%s  %s\n' '3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4' "$RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog
      - name: Scan complete commit range without executing candidate code
        run: |
          python3 trusted-policy/.forlex/security/secret_scan.py scan \
            --context "$RUNNER_TEMP/secret-scan-context.json" --repo candidate-source \
            --scanner "$RUNNER_TEMP/trufflehog" \
            --policy trusted-policy/.forlex/security/exceptions.json \
            --output "$RUNNER_TEMP/secret-scan-report.json" --timeout 1200
      - name: Publish current-head result or explicit failure
        if: always() && steps.context.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 trusted-policy/.forlex/security/secret_scan.py publish \
            --context "$RUNNER_TEMP/secret-scan-context.json" \
            --report "$RUNNER_TEMP/secret-scan-report.json"
      - name: Retain redacted findings only
        if: always() && steps.context.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-scan-report.json
          if-no-files-found: ignore
          retention-days: 14
